name: Release

# 触发方式：版本号滚动（pyproject.toml 的 version 变化）→ 在当前 commit 上打 tag
# 并创建 GitHub Release。重复推送同一个版本号不会重复发布（tag 已存在即跳过）。
#
# - 预发布版本（PEP 440 的 aN / bN / rcN，如 0.5.0b1）自动标记为 prerelease。
# - Release 正文取自 CHANGELOG.md 里对应版本的段落；版本号滚动了却没有对应段落
#   （或段落是空的）会让这一步直接失败，而不是发一个正文空白的 Release。
# - sdist / wheel 会作为附件上传，并做一次内容检查（tools/check_sdist.py）。
#
# 想再往前一步（自动发布到 PyPI）时，推荐用 PyPI Trusted Publishing：
# 在 job 上加 `permissions: id-token: write` 并追加一步
# `uv publish --trusted-publishing always`，无需在仓库里存 token。

on:
  push:
    branches: ["dev", "main", "master"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 打 tag 并发 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 读取 pyproject 版本号
        id: version
        run: |
          version=$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "::error::版本号 '$version' 不是规范的 PEP 440 版本 (期望 X.Y.Z[aN|bN|rcN])"
            exit 1
          fi
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "发布目标: v$version (prerelease=$([[ "$version" =~ (a|b|rc)[0-9]+$ ]] && echo true || echo false))"

      - name: 该版本是否已经发布过
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag ${{ steps.version.outputs.tag }} 已存在，跳过发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 sdist / wheel
        if: steps.check.outputs.exists == 'false'
        run: uv build

      - name: 检查 sdist 内容
        if: steps.check.outputs.exists == 'false'
        run: python3 tools/check_sdist.py

      - name: 从 CHANGELOG 提取本版本正文
        if: steps.check.outputs.exists == 'false'
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY' > release-body.md
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\].*?$(?P<body>.*?)(?=^## \[|\Z)",
              re.M | re.S,
          )
          match = pattern.search(text)
          if match is None:
              raise SystemExit(
                  f"CHANGELOG.md 里找不到 '## [{version}]' 段落; "
                  "版本号滚动时必须补上对应段落 (否则会发出正文空白的 Release)"
              )
          body = match.group("body").strip()
          if not body:
              raise SystemExit(f"CHANGELOG.md 的 '## [{version}]' 段落是空的")
          print(body)
          PY
          echo "--- release body ---"
          head -n 20 release-body.md

      - name: 创建 tag 与 GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-body.md \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            dist/*
